# Security headers, kept in a snippet because nginx does NOT inherit server-level
# add_header directives into any location block that declares its own add_header.
# Both locations below set Cache-Control, so each must include this explicitly.
#
# connect-src must allow the API origin and its websocket scheme for SignalR. It
# is intentionally broad (https/wss) because the API domain is only known at
# deploy time; tighten it to the exact origin if that domain is fixed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
